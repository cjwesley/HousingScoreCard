<style>
:root{--paper:#fbfaf7;--ink:#16212b;--hair:#d8d4c9;--muted:#6b7178;--hi:#fdf3cf;--hi-edge:#e4c94e;--good:#1d5c3f;--bad:#8c1d18;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:'Libre Franklin',system-ui,sans-serif;font-size:15px;line-height:1.5;padding:48px 40px 72px}
.wrap{max-width:1240px;margin:0 auto}
header{border-bottom:3px double var(--ink);padding-bottom:22px;margin-bottom:22px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
h1{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:38px;line-height:1.12;margin:0 0 12px;letter-spacing:-.01em}
.dek{color:var(--muted);max-width:74ch;margin:0;font-size:16px}
.stats{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--hair);margin-bottom:26px}
.stat{padding:16px 28px 16px 0;margin-right:28px;border-right:1px solid var(--hair)}
.stat:last-child{border-right:0}
.stat .k{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:'Fraunces',Georgia,serif;font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:4px}
.stat.hi .v{background:var(--hi);box-shadow:inset 4px 0 0 var(--hi-edge);padding:2px 10px 2px 12px;display:inline-block}
.sortstate{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);margin:0 0 10px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-family:'IBM Plex Mono',monospace;font-size:13px;font-variant-numeric:tabular-nums}
thead th{position:sticky;top:0;background:var(--paper);text-align:left;font-weight:600;padding:12px 14px;border-bottom:2px solid var(--ink);cursor:pointer;user-select:none;white-space:nowrap}
thead th.num{text-align:right}
thead th .arrow{color:var(--muted);margin-left:6px;font-size:11px}
thead th.active{background:#f1efe8}
thead th:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
tbody td{padding:11px 14px;border-bottom:1px solid var(--hair);vertical-align:top}
tbody td.num{text-align:right;white-space:nowrap}
tbody td.rank{color:var(--muted);width:44px}
tbody tr:hover td{background:#f4f2ec}
tbody tr.hi td{background:var(--hi)}
tbody tr.hi td:first-child{box-shadow:inset 4px 0 0 var(--hi-edge)}
td.best{color:var(--good);font-weight:600}
td.worst{color:var(--bad);font-weight:600}
tfoot td{padding:14px;border-top:2px solid var(--ink);font-weight:600}
tfoot td.num{text-align:right;white-space:nowrap}
h2.subhead{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:22px;margin:0 0 10px}
table.sub{width:auto;min-width:520px;margin:0 0 34px}
table.sub thead th{cursor:default;position:static}
table.sub tbody td{padding:9px 14px}
footer{margin-top:26px;padding-top:16px;border-top:1px solid var(--hair);color:var(--muted);font-size:13px;max-width:90ch}
footer p{margin:0 0 8px}
@media (max-width:720px){body{padding:24px 16px 48px}h1{font-size:28px}.stat .v{font-size:22px}.stat{padding-right:16px;margin-right:16px}}
@media print{thead th{position:static}body{padding:0}}
</style>
</head>

  pct2: v => v==null ? '\u2013' : v.toFixed(2) + '%'
};
let sort = {...CONFIG.defaultSort};
document.getElementById('eyebrow').textContent = CONFIG.eyebrow;
document.getElementById('title').textContent = CONFIG.title;
document.getElementById('dek').textContent = CONFIG.dek;
document.getElementById('footer').innerHTML = CONFIG.footerHTML;
document.getElementById('subtable').innerHTML = CONFIG.subtableHTML || '';
document.getElementById('stats').innerHTML = CONFIG.stats.map((s,i)=>`<div class="stat${i===1?' hi':''}"><div class="k">${s[0]}</div><div class="v">${s[1]}</div></div>`).join('');
const hdr = document.getElementById('hdr');
hdr.innerHTML = '<th class="rank">#</th>' + CONFIG.columns.map(c => `<th data-key="${c.key}" class="${c.fmt==='text'?'':'num'}" tabindex="0" title="${c.tooltip||''}">${c.label}<span class="arrow"></span></th>`).join('');
hdr.querySelectorAll('th[data-key]').forEach(th => {
  const go = () => { const k = th.dataset.key; if (sort.key===k) sort.dir *= -1; else { const c = CONFIG.columns.find(x=>x.key===k); sort = {key:k, dir: c.fmt==='text' ? 1 : -1}; } render(); };
  th.addEventListener('click', go);
  th.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') { e.preventDefault(); go(); } });
});
function render(){
  const col = CONFIG.columns.find(c=>c.key===sort.key);
  const rows = [...CONFIG.data].sort((a,b)=>{
    const x=a[sort.key], y=b[sort.key];
    if (x==null) return 1; if (y==null) return -1;
    return (typeof x==='string' ? x.localeCompare(y) : x-y) * sort.dir;
  });
  const ext = {};
  CONFIG.columns.filter(c=>c.extremes).forEach(c=>{
    const vals = CONFIG.data.filter(r=>!r.excludeFromExtremes && r[c.key]!=null).map(r=>r[c.key]);
    ext[c.key] = {min:Math.min(...vals), max:Math.max(...vals), mode:c.extremes};
  });
  document.getElementById('body').innerHTML = rows.map((r,i)=>'<tr class="'+(r.highlight?'hi':'')+'"><td class="rank">'+String(i+1).padStart(2,'0')+'</td>'+CONFIG.columns.map(c=>{
    let cls = c.fmt==='text' ? '' : 'num';
    const e = ext[c.key];
    if (e && !r.excludeFromExtremes && r[c.key]!=null){
      const isMax = r[c.key]===e.max, isMin = r[c.key]===e.min;
      if (e.mode==='highGood'){ if(isMax) cls+=' best'; if(isMin) cls+=' worst'; }
      else { if(isMin) cls+=' best'; if(isMax) cls+=' worst'; }
    }
    return `<td class="${cls}">${fmts[c.fmt](r[c.key])}</td>`;
  }).join('')+'</tr>').join('');
  hdr.querySelectorAll('th[data-key]').forEach(th=>{
    const on = th.dataset.key===sort.key; th.classList.toggle('active',on);
    th.querySelector('.arrow').textContent = on ? (sort.dir===1?'\u25B2':'\u25BC') : '';
  });
  document.getElementById('sortstate').textContent = `Sorted by ${col.label}, ${sort.dir===1?'ascending':'descending'} (${CONFIG.data.length} sales)`;
  const sums = {};
  CONFIG.columns.forEach(c=>{ if(c.fmt==='money') sums[c.key]=CONFIG.data.reduce((s,r)=>s+(r[c.key]||0),0); });
  document.getElementById('foot').innerHTML = '<td></td>' + CONFIG.columns.map((c,i)=> i===0 ? '<td>Total</td>' : (c.fmt==='money' ? `<td class="num">${money(sums[c.key])}</td>` : '<td></td>')).join('');
}
render();
</script>
</body>
</html>
